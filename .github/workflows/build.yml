name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Upload Plugin
      uses: actions/upload-artifact@v4
      with:
        name: ParkourPlugin
        path: target/ParkourPlugin.jar

    
    - name: Upload Plugin
      uses: actions/upload-artifact@v3
      with:
        name: ParkourPlugin
        path: target/ParkourPlugin.jar
